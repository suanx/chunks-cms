worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- 日志格式 ----
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ---- 性能优化 ----
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ---- 请求体大小（视频封面等上传） ----
    client_max_body_size 100m;

    # ---- Gzip 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/opentype
        image/svg+xml;

    # ---- 上游：NestJS 后端 ----
    upstream backend {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html/web;
        index index.html;

        # ====================================
        #  API 反向代理 → NestJS (port 3000)
        # ====================================
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_http_version 1.1;
            proxy_read_timeout  300s;
            proxy_send_timeout  300s;

            # WebSocket 支持（弹幕等）
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ---- 防盗链：视频/图片资源 ----
        location ~* \.(mp4|webm|m3u8|ts|flv|avi|mov)$ {
            valid_referers none blocked server_names *.chunyu-cms.com chunyu-cms.com;
            if ($invalid_referer) {
                return 403;
            }
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ====================================
        #  上传文件静态访问
        # ====================================
        location /uploads/ {
            alias /app/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ====================================
        #  管理端 — /admin 前缀 → 静态文件
        # ====================================
        location /admin {
            alias /usr/share/nginx/html/admin;
            try_files $uri $uri/ /admin/index.html;

            # 管理端静态资源缓存（短缓存，方便更新）
            location ~* \.(?:css|js|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
                alias /usr/share/nginx/html/admin;
                try_files $uri =404;
                expires 7d;
                add_header Cache-Control "public";
            }
        }

        # ====================================
        #  用户端 — 所有其他路径 → Nuxt SSR/SPA
        # ====================================
        location / {
            try_files $uri $uri/ /index.html;

            # 静态资源长缓存
            location ~* \.(?:css|js|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp|mp4|webm)$ {
                try_files $uri =404;
                expires 30d;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }

        # ====================================
        #  健康检查端点
        # ====================================
        location = /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # ---- 禁止访问隐藏文件 ----
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
